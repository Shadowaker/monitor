<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Maintenance Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/staff.css') }}">
</head>
<body>
  <div class="container staff-page">
    <div class="left">
      {% include 'partials/cluster_map.j2.html' %}
    </div>

    <div class="right">
      <div class="maintenance-form">
        <h3>Segnala PC in Manutenzione</h3>
        <input type="text" id="pcId" placeholder="ID separati da virgola (es. c3r5s4, c2r3, c1)">
        <button type="button" onclick="addToMaintenanceList()">Aggiungi alla Lista</button>
      </div>

      <div class="maintenance-list">
        <h3>PC in Manutenzione</h3>
        <ul id="maintenanceList">
          {% for pc in maintenance_pcs %}
          <li>
            {{ pc }}
            <div>
              <button type="button" class="confirm-button" disabled>Confermato</button>
              <button type="button" class="remove-button" onclick="removeMaintenance('{{ pc }}')">Rimuovi</button>
            </div>
          </li>
          {% endfor %}
        </ul>
        <div class="bulk-actions">
          <button type="button" class="bulk-button confirm-all-button" onclick="confirmAllMaintenance()">Conferma Tutti</button>
          <button type="button" class="bulk-button remove-all-button" onclick="removeAllMaintenance()">Rimuovi Tutti</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const maintenancePCs = {{ maintenance_pcs|tojson|safe }};
    const pendingMaintenance = new Set();

    const offlinePCs = {{ offline_pcs|default([])|tojson|safe }};
    const usedPCs = {{ online_pcs|default([])|tojson|safe }};

    {% set _offline_n = offline_pcs|default([])|length %}
    {% set _used_n = online_pcs|default([])|length %}
    {% set _maint_n = maintenance_pcs|default([])|length %}
    {% set _stats_fallback = {
      'total': 150,
      'offline': _offline_n,
      'online': 150 - _offline_n,
      'occupied': _used_n,
      'maintenance': _maint_n,
      'available': [0, 150 - _offline_n - _used_n - _maint_n]|max
    } %}
    const serverStats = {{ location_stats|default(_stats_fallback)|tojson|safe }};

    function resetCells() {
      document.querySelectorAll('[id^="c1"], [id^="c2"], [id^="c3"]').forEach((element) => {
        element.style.color = 'var(--color-available)';
        element.style.backgroundColor = '';
        element.classList.remove('offline', 'maintenance', 'occupied');
        element.innerHTML = '';
      });
    }

    function setOfflineLocation(ids) {
      ids.forEach((id) => {
        const element = document.getElementById(id);
        if (element) {
          element.style.color = 'var(--color-offline)';
          element.classList.add('offline');
        }
      });
    }

    function setUsedLocation(ids) {
      ids.forEach((id) => {
        const element = document.getElementById(id);
        if (element) {
          element.style.color = 'var(--color-occupied)';
          element.classList.add('occupied');
        }
      });
    }

    function applyMaintenanceStatus() {
      maintenancePCs.forEach((pcId) => {
        const cell = document.getElementById(pcId);
        if (cell) {
          cell.style.color = 'var(--color-maintenance)';
          cell.style.backgroundColor = 'var(--color-maintenance)';
          cell.classList.add('maintenance');
        }
      });
    }

    function fetchAndHighlight() {
      resetCells();
      if (offlinePCs.length) setOfflineLocation(offlinePCs);
      if (usedPCs.length) setUsedLocation(usedPCs);
      applyMaintenanceStatus();
      updateStatistics();
    }

    function updateStatistics() {
      const generalInfo = document.getElementById('general-stats');
      if (!generalInfo) return;
      generalInfo.innerHTML = `
        <p class="spenti">Spenti ⚡️ <span>${serverStats.offline}</span></p>
        <p class="online">Online <span>${serverStats.online}</span></p>
        <p class="disponibili">Disponibili <span>${serverStats.available}</span></p>
        <p class="utilizzati">Utilizzati <span>${serverStats.occupied}</span></p>
        <p class="manutenzione">Manutenzione⚠️ <span>${serverStats.maintenance}</span></p>
      `;
    }

    function expandInput(input) {
      const parts = input.trim().toLowerCase();
      if (!parts) return [];

      if (/^c[123]$/.test(parts)) {
        return Array.from(document.querySelectorAll(`.cell[id^="${parts}"]`)).map((c) => c.id);
      }
      if (/^c[123]r\d+$/.test(parts)) {
        return Array.from(document.querySelectorAll(`.cell[id^="${parts}"]`)).map((c) => c.id);
      }
      if (/^c[123]r\d+s\d+$/.test(parts)) {
        return [parts];
      }
      return [parts];
    }

    function addToMaintenanceList() {
      const input = document.getElementById('pcId').value;
      const inputs = input.split(',').map((id) => id.trim()).filter(Boolean);

      inputs.forEach((item) => {
        expandInput(item).forEach((pcId) => {
          if (!maintenancePCs.includes(pcId) && !pendingMaintenance.has(pcId)) {
            confirmMaintenance(pcId);
          }
        });
      });

      document.getElementById('pcId').value = '';
    }

    document.querySelectorAll('.cell').forEach((cell) => {
      cell.addEventListener('click', () => {
        const pcId = cell.id;
        if (!maintenancePCs.includes(pcId) && !pendingMaintenance.has(pcId)) {
          confirmMaintenance(pcId);
        } else if (maintenancePCs.includes(pcId)) {
          removeMaintenance(pcId);
        }
      });
    });

    function confirmAllMaintenance() {
      Array.from(pendingMaintenance).forEach((pcId) => confirmMaintenance(pcId));
    }

    function removeAllMaintenance() {
      [...maintenancePCs, ...Array.from(pendingMaintenance)].forEach((pcId) => removeMaintenance(pcId));
    }

    function updateMaintenanceList() {
      const list = document.getElementById('maintenanceList');
      list.innerHTML = '';

      maintenancePCs.forEach((pc) => {
        const li = document.createElement('li');
        li.innerHTML = `
          ${pc}
          <div>
            <button type="button" class="confirm-button" disabled>Confermato</button>
            <button type="button" class="remove-button" onclick="removeMaintenance('${pc}')">Rimuovi</button>
          </div>
        `;
        list.appendChild(li);
      });

      pendingMaintenance.forEach((pc) => {
        const li = document.createElement('li');
        li.innerHTML = `
          ${pc}
          <button type="button" class="confirm-button" onclick="confirmMaintenance('${pc}')">Conferma</button>
        `;
        list.appendChild(li);
      });
    }

    function confirmMaintenance(pcId) {
      const formData = new FormData();
      formData.append('pc_id', pcId);

      fetch('/toggle_maintenance', { method: 'POST', body: formData })
        .then((response) => response.json())
        .then((data) => {
          if (data.success) {
            const cell = document.getElementById(pcId);
            if (cell) {
              cell.classList.add('maintenance');
              cell.style.color = 'var(--color-maintenance)';
              cell.style.backgroundColor = 'var(--color-maintenance)';
            }
            if (!maintenancePCs.includes(pcId)) maintenancePCs.push(pcId);
            pendingMaintenance.delete(pcId);
            serverStats.maintenance = maintenancePCs.length;
            updateMaintenanceList();
            updateStatistics();
          }
        })
        .catch((error) => console.error('Error:', error));
    }

    function removeMaintenance(pcId) {
      const formData = new FormData();
      formData.append('pc_id', pcId);
      formData.append('action', 'remove');

      fetch('/toggle_maintenance', { method: 'POST', body: formData })
        .then((response) => response.json())
        .then((data) => {
          if (data.success) {
            const cell = document.getElementById(pcId);
            if (cell) cell.classList.remove('maintenance');
            const index = maintenancePCs.indexOf(pcId);
            if (index > -1) maintenancePCs.splice(index, 1);
            pendingMaintenance.delete(pcId);
            fetchAndHighlight();
            updateMaintenanceList();
          }
        })
        .catch((error) => console.error('Error:', error));
    }

    window.addEventListener('load', () => {
      fetchAndHighlight();
      updateMaintenanceList();
    });
  </script>
</body>
</html>
